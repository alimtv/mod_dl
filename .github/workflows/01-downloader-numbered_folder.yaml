name: Multi-Link Download to Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'File URLs (space-separated, one per line)'
        required: true
        type: string
      max_part_mb:
        description: 'Max part size in MB (0 = no split)'
        required: false
        type: number
        default: 0
      zip_all:
        description: 'Zip all files together?'
        required: false
        type: boolean
        default: false
      zip_name:
        description: 'Name for zip file (if zip_all is true)'
        required: false
        type: string
        default: 'files'
      release_tag:
        description: 'Release tag (auto if empty)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl bc zip

      - name: Download all files
        id: download
        shell: bash
        run: |
          URLS="${{ github.event.inputs.urls }}"
          mkdir -p files
          echo "" > files/download.log
          
          for URL in $URLS; do
            FILENAME=$(basename "$URL" | cut -d'?' -f1 | sed 's/[^a-zA-Z0-9._()-]/_/g')
            [ -z "$FILENAME" ] && FILENAME="file_$RANDOM"
            
            echo "Downloading: $URL -> $FILENAME"
            echo "$FILENAME <- $URL" >> files/download.log
            
            curl -L --fail --retry 3 --retry-delay 10 \
              --connect-timeout 30 --max-time 1800 \
              -o "files/$FILENAME" "$URL" && {
                SIZE=$(stat -c %s "files/$FILENAME")
                SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
                echo "  OK: $FILENAME ($SIZE_MB MB)"
              } || {
                echo "  FAILED: $FILENAME"
              }
          done
          
          TOTAL_FILES=$(ls -1 files/ | grep -v download.log | wc -l)
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT

      - name: Zip all files if requested
        id: zip
        shell: bash
        run: |
          if [ "${{ github.event.inputs.zip_all }}" = "true" ]; then
            echo "Creating combined zip..."
            cd files
            ZIP_NAME="${{ github.event.inputs.zip_name }}_$(date +%Y%m%d_%H%M%S).zip"
            zip -r "../$ZIP_NAME" . -x download.log
            cd ..
            
            # Clean up individual files
            rm -rf files
            
            echo "zipped=true" >> $GITHUB_OUTPUT
            echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
            echo "final_path=$ZIP_NAME" >> $GITHUB_OUTPUT
          else
            echo "zipped=false" >> $GITHUB_OUTPUT
            echo "final_path=files/" >> $GITHUB_OUTPUT
          fi

      - name: Split large files if needed
        id: split
        shell: bash
        run: |
          MAX_PART_MB="${{ github.event.inputs.max_part_mb }}"
          
          if [ "$MAX_PART_MB" -gt 0 ]; then
            FINAL_PATH="${{ steps.zip.outputs.final_path }}"
            
            if [ -f "$FINAL_PATH" ]; then
              # Single file
              SIZE=$(stat -c %s "$FINAL_PATH")
              SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
              
              if (( $(echo "$SIZE_MB > $MAX_PART_MB" | bc -l) )); then
                echo "Splitting $FINAL_PATH ($SIZE_MB MB) into ${MAX_PART_MB}MB parts..."
                mkdir -p parts
                split -b ${MAX_PART_MB}m "$FINAL_PATH" "parts/$(basename $FINAL_PATH).part."
                rm "$FINAL_PATH"
                echo "final_path=parts/" >> $GITHUB_OUTPUT
              fi
            elif [ -d "$FINAL_PATH" ]; then
              # Directory
              for f in "$FINAL_PATH"/*; do
                [ -f "$f" ] || continue
                SIZE=$(stat -c %s "$f")
                SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
                
                if (( $(echo "$SIZE_MB > $MAX_PART_MB" | bc -l) )); then
                  echo "Splitting $(basename $f) ($SIZE_MB MB)..."
                  mkdir -p parts
                  split -b ${MAX_PART_MB}m "$f" "parts/$(basename $f).part."
                  rm "$f"
                fi
              done
              # If parts dir was created
              if [ -d parts ]; then
                # Move any remaining unsplit files
                cp -r "$FINAL_PATH"/* parts/ 2>/dev/null
                rm -rf "$FINAL_PATH"
                echo "final_path=parts/" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Get current date
        id: get_date
        shell: bash
        run: echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Create Release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('dl-{0}', github.run_number) }}
          name: ${{ format('Download - {0}', github.run_number) }}
          body: |
            ## Downloaded Files
            
            Total files: ${{ steps.download.outputs.total_files }}
            Date: ${{ steps.get_date.outputs.date }}
            
            ### Links
            ${{ github.event.inputs.urls }}
          files: |
            ${{ steps.split.outputs.final_path || steps.zip.outputs.final_path || 'files/' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
