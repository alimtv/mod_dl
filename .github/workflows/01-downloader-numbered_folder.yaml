name: ⬇️ 01- Download from url

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of URLs to download'
        required: true
        type: string
      mode:
        description: 'Download mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      password:
        description: 'Password for zip files (optional)'
        required: false
        default: ''
        type: string
      split_size:
        description: 'Split size in MB (default: 45)'
        required: false
        type: number
        default: 45

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: Install aria2 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip curl bc p7zip-full

      - name: AVASAM Downloader - https://avasam.ir
        run: |
          echo "🏷️  AVASAM - Your Download Solution"
          echo "🌐 https://avasam.ir"
          echo ""

      - name: Download files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          URLS="${{ github.event.inputs.urls }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"
          SPLIT_THRESHOLD_MB="${{ github.event.inputs.split_size }}"
          SPLIT_THRESHOLD_BYTES=$(( SPLIT_THRESHOLD_MB * 1024 * 1024 ))
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          
          MAIN_COUNTER=1
          
          echo "AVASAM (https://avasam.ir) - Downloading with mode: $MODE"
          echo "Split threshold: $SPLIT_THRESHOLD_MB MB"
          echo "Backup directory: $BACKUP_DIR"
          
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "Password protection: ENABLED"
          else
            echo "Password protection: DISABLED"
          fi
          
          mkdir -p downloads tmp_downloads
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          download_with_retry() {
            local URL="$1"
            local FILENAME="$2"
            local MAX_RETRIES=3
            local RETRY_DELAY=5
            local SUCCESS=false
            local ERROR_LOG=""
            
            rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
            
            for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
              echo "Attempt $attempt of $MAX_RETRIES for $FILENAME"
              rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
              
              ERROR_LOG=$(aria2c \
                --split=2 \
                --max-connection-per-server=2 \
                --min-split-size=20M \
                --max-tries=3 \
                --retry-wait=5 \
                --timeout=60 \
                --connect-timeout=30 \
                --follow-torrent=false \
                --check-certificate=false \
                --allow-overwrite=true \
                --auto-file-renaming=false \
                --dir="tmp_downloads" \
                --out="$FILENAME" \
                "$URL" 2>&1)
              
              if [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
                local FILE_SIZE=$(stat -c%s "tmp_downloads/$FILENAME" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 0 ]; then
                  SUCCESS=true
                  echo "Download successful: $FILENAME (${FILE_SIZE} bytes)"
                  break
                fi
              fi
              
              rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
              echo "aria2c failed, trying curl..."
              
              ERROR_LOG=$(curl -L -f -# \
                --retry 3 \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 3600 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                -o "tmp_downloads/$FILENAME" \
                "$URL" 2>&1)
              
              if [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
                local FILE_SIZE=$(stat -c%s "tmp_downloads/$FILENAME" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 0 ]; then
                  SUCCESS=true
                  echo "Download successful: $FILENAME (${FILE_SIZE} bytes)"
                  break
                fi
              fi
              
              rm -f "tmp_downloads/$FILENAME"
              echo "Attempt $attempt failed. Waiting ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            done
            
            if [ "$SUCCESS" = true ] && [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
              return 0
            fi
            
            rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
            return 1
          }
          
          for URL in $URLS; do
            ORIGINAL_FILENAME=$(basename "$URL" | sed 's/%20/ /g' | sed 's/%2F/-/g' | sed 's/[?#].*//')
            ORIGINAL_FILENAME=$(echo "$ORIGINAL_FILENAME" | sed 's/[<>:"|?*]/_/g')
            
            if [ -f "tmp_downloads/$ORIGINAL_FILENAME" ]; then
              BASENAME="${ORIGINAL_FILENAME%.*}"
              EXT="${ORIGINAL_FILENAME##*.}"
              COUNTER=1
              while [ -f "tmp_downloads/${BASENAME}_${COUNTER}.${EXT}" ]; do
                COUNTER=$((COUNTER + 1))
              done
              FILENAME="${BASENAME}_${COUNTER}.${EXT}"
            else
              FILENAME="$ORIGINAL_FILENAME"
            fi
            
            echo "Downloading $URL -> $FILENAME"
            if ! download_with_retry "$URL" "$FILENAME"; then
              echo "Failed to download: $FILENAME"
            fi
          done
          
          for FILE in tmp_downloads/*; do
            [ -f "$FILE" ] || continue
            
            if [ ! -s "$FILE" ] || [ $(stat -c%s "$FILE") -eq 0 ]; then
              echo "WARNING: Removing empty file: $FILE"
              rm -f "$FILE"
              continue
            fi
            
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            BASENAME_NO_EXT="${BASENAME%.*}"
            
            TEMP_DIR="$BACKUP_DIR/temp_${MAIN_COUNTER}"
            mkdir -p "$TEMP_DIR"
            
            if [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
              echo "$BASENAME is $(( SIZE / 1024 / 1024 ))MB - splitting into ${SPLIT_THRESHOLD_MB}MB parts"
              
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -j -P "${ZIP_PASSWORD}" -s ${SPLIT_THRESHOLD_MB}m \
                  "$TEMP_DIR/file.zip" \
                  "$FILE"
              else
                zip -j -s ${SPLIT_THRESHOLD_MB}m \
                  "$TEMP_DIR/file.zip" \
                  "$FILE"
              fi
              
              PART_COUNTER=1
              for part_file in $(ls "$TEMP_DIR"/file.zip "$TEMP_DIR"/file.z[0-9]* 2>/dev/null | sort); do
                if [ -f "$part_file" ]; then
                  if [[ "$part_file" == *.zip ]]; then
                    mv "$part_file" "$TEMP_DIR/file_${PART_COUNTER}.zip"
                  else
                    EXTENSION="${part_file##*.}"
                    mv "$part_file" "$TEMP_DIR/file_${PART_COUNTER}.${EXTENSION}"
                  fi
                  PART_COUNTER=$((PART_COUNTER + 1))
                fi
              done
              
              TOTAL_PARTS=$((PART_COUNTER - 1))
            else
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -j -P "${ZIP_PASSWORD}" \
                  "$TEMP_DIR/file_1.zip" \
                  "$FILE"
              else
                zip -j \
                  "$TEMP_DIR/file_1.zip" \
                  "$FILE"
              fi
              TOTAL_PARTS=1
            fi
            
            FILE_COUNT=$(ls -1 "$TEMP_DIR" 2>/dev/null | wc -l)
            FOLDER_NAME="${MAIN_COUNTER}_${FILE_COUNT}"
            FINAL_PATH="$BACKUP_DIR/$FOLDER_NAME"
            mkdir -p "$FINAL_PATH"
            
            mv "$TEMP_DIR"/* "$FINAL_PATH/"
            rmdir "$TEMP_DIR"
            
            FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
            TOTAL_SIZE=0
            
            for part_file in "$FINAL_PATH"/*; do
              if [ -f "$part_file" ]; then
                PART_SIZE=$(stat -c%s "$part_file" 2>/dev/null || echo 0)
                TOTAL_SIZE=$((TOTAL_SIZE + PART_SIZE))
              fi
            done
            
            TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
            
            DOWNLOAD_LINKS_MD=""
            LINK_NUM=0
            
            for part_file in $(ls "$FINAL_PATH"/file_*.zip "$FINAL_PATH"/file_*.z[0-9]* 2>/dev/null | sort); do
              if [ -f "$part_file" ]; then
                PART_BASENAME=$(basename "$part_file")
                PART_ENCODED=$(urlencode "${PART_BASENAME}")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${FOLDER_ENCODED}/${PART_ENCODED}"
                LINK_NUM=$((LINK_NUM + 1))
                DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
              fi
            done
            
            {
              echo "# ${BASENAME_NO_EXT}"
              echo ""
              echo "---"
              echo ""
              echo "## Download Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **Original File** | \`${BASENAME}\` |"
              echo "| **Total Size** | **${FILE_COUNT} parts** - **${TOTAL_SIZE_MB} MB** |"
              echo "| **Status** | **Complete (100%)** |"
              if [ -n "$ZIP_PASSWORD" ]; then
                echo "| **Password Protected** | **YES** |"
              else
                echo "| **Password Protected** | **NO** |"
              fi
              echo ""
              echo "---"
              echo ""
              echo "## Download Links"
              echo ""
              echo "| # | File | Link |"
              echo "|---|------|------|"
              printf '%s' "${DOWNLOAD_LINKS_MD}"
              echo ""
              echo "---"
              echo ""
              echo "## How to Extract"
              echo ""
              echo "1. **Download all parts**"
              echo "2. **Open** \`file_1.zip\` with WinRAR, 7-Zip, Ark, or any standard zip tool"
              echo "3. **Extract** — all parts combine automatically"
              if [ -n "$ZIP_PASSWORD" ]; then
                echo "4. Enter the password when prompted"
              fi
              echo ""
              echo "---"
              echo ""
              echo "*This tool created by [avasam.ir](https://avasam.ir)*"
            } > "$FINAL_PATH/README.md"
            
            echo "Created folder: $FOLDER_NAME with $FILE_COUNT parts"
            MAIN_COUNTER=$((MAIN_COUNTER + 1))
          done
          
          rm -rf tmp_downloads
          echo ""
          echo "===== Backup folder contents ====="
          find "$BACKUP_DIR" -type f | head -50

      - name: Update README.md with download links
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          
          mkdir -p downloads
          
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi
          
          FOLDERS=$(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)
          
          if [ -z "$FOLDERS" ]; then
            echo "No folders found in downloads"
            exit 0
          fi
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          {
            echo "# Downloaded list :"
            echo ""
            while IFS= read -r FOLDER; do
              if [ -n "$FOLDER" ]; then
                FOLDER_ENCODED=$(urlencode "${FOLDER}")
                echo "- [${FOLDER}](./${FOLDER_ENCODED})"
              fi
            done <<< "$FOLDERS"
            echo ""
            echo "---"
            echo ""
            echo "*This tool created by [avasam.ir](https://avasam.ir)*"
          } > "downloads/README.md"
          
          echo "downloads/README.md created"
          
          SECTION_TITLE="فایل های دانلود شده در گیتهاب شما :"
          
          if [ ! -f "README.md" ]; then
            echo "# AVASAM Downloader" > README.md
            echo "" >> README.md
            echo "https://avasam.ir" >> README.md
            echo "" >> README.md
          fi
          
          if grep -q "$SECTION_TITLE" README.md; then
            sed -i "/$SECTION_TITLE/,/^---$/d" README.md
            sed -i '${/^$/d;}' README.md
          fi
          
          {
            echo ""
            echo "---"
            echo ""
            echo "## $SECTION_TITLE"
            echo ""
            COUNTER=1
            while IFS= read -r FOLDER; do
              if [ -n "$FOLDER" ]; then
                FOLDER_ENCODED=$(urlencode "${FOLDER}")
                echo "${COUNTER}. [$FOLDER]($REPO_URL/$FOLDER_ENCODED)"
                echo ""
                COUNTER=$((COUNTER + 1))
              fi
            done <<< "$FOLDERS"
            echo "---"
          } >> README.md
          
          echo "README.md updated"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          
          echo "Pushing files to repository..."
          
          git fetch origin "$BRANCH" || true
          git reset --hard origin/"$BRANCH" || true
          
          mkdir -p downloads
          
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi
          
          git add downloads/ README.md
          
          if ! git diff --cached --quiet; then
            git commit -m "[AVASAM] Add downloaded files [skip ci]"
            
            PUSH_RETRY=0
            while [ $PUSH_RETRY -lt 5 ]; do
              PUSH_RETRY=$((PUSH_RETRY + 1))
              if git push origin HEAD:"$BRANCH"; then
                echo "Push successful!"
                break
              else
                echo "Push failed, retry $PUSH_RETRY/5..."
                sleep 5
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "All files pushed successfully!"
          echo "AVASAM (https://avasam.ir)"
          echo "=========================================="
